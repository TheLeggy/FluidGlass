<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluidGlass</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: oklch(17.764% 0.00002 271.152);
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .test-shape-1 {
        position: absolute;
        inset: 0;
        right: 480px;
        width: 440px;
        height: 440px;
        margin: auto;
        border-radius: 40px;
      }
      .test-shape-2 {
        position: absolute;
        inset: 0;
        left: 420px;
        width: 440px;
        height: 880px;
        margin: auto;
        border-radius: 40px;
      }
    </style>
  </head>
  <body>
    <!-- normal html content gets put into the canvas where the WebGPU effects will be able to work. 
    Needs HTML-in-canvas, though -->
    <main>
      <img src="/promo/testimage.jpg" alt="" />
      <div class="test-shape-1 glass"></div>
      <div class="test-shape-2 glass"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
